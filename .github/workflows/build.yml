name: Build Windows Apps

on:
  push:
    branches: [ "main", "claude/**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Install dependencies
      run: flutter pub get

    - name: Analyze
      run: flutter analyze --no-fatal-infos

    - name: Tests
      run: flutter test

    - name: Enable Windows Desktop
      run: flutter config --enable-windows-desktop

    # Программа 1: «Показ» — 3D-конструктор для ноутбука с телевизором
    - name: Build «Показ»
      run: |
        flutter build windows --release -t lib/main.dart
        Move-Item build/windows/x64/runner/Release out-pokaz
        Rename-Item out-pokaz/desing_app.exe "3D-Kamron-Pokaz.exe"

    # Программа 2: «Заказы» — для ноутбука, где принимают заказы с сайта
    - name: Build «Заказы»
      run: |
        flutter build windows --release -t lib/main_orders.dart
        Move-Item build/windows/x64/runner/Release out-zakazy
        Rename-Item out-zakazy/desing_app.exe "3D-Kamron-Zakazy.exe"

    - name: Upload «Показ»
      uses: actions/upload-artifact@v4
      with:
        name: 3D-Kamron-Pokaz-Windows
        path: out-pokaz/

    - name: Upload «Заказы»
      uses: actions/upload-artifact@v4
      with:
        name: 3D-Kamron-Zakazy-Windows
        path: out-zakazy/
